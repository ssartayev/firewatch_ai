# =====================================================================
# FireWatch AI — конфигурация MVP
# Все пути указаны относительно папки firewatch/ (корень проекта).
# Секреты (токен Telegram и т.п.) НЕ здесь — они в .env, см. .env.example
# =====================================================================

# Источник видео:
#   0                      -> веб-камера ноутбука (по умолчанию)
#   "rtsp://user:pass@ip:554/..." -> IP-камера
#   "data/demo_fire.mp4"   -> демо-ролик со «сваркой» (офлайн-демо)
# Можно переопределить без правки файла: FIREWATCH_VIDEO_SOURCE=... uvicorn ...
video_source: 0

# Целевой FPS обработки (кадры прореживаются до этого значения).
target_fps: 3

# Зациклить видеофайл (удобно для демо/пилота). Для RTSP игнорируется.
loop_video: true

# ------------------------------------------------------------------
# Модели-детекторы. Для каждой:
#   weights  — путь к .pt весам, либо спец-значение "mock" (демо-детектор
#              без нейросети — выдаёт сценарные детекции, чтобы прогнать всю
#              логику зон/правил/алертов, пока нет реальных весов).
#   classes  — маппинг «индекс класса модели -> каноничное имя».
#              Каноничные имена, которые понимает логика:
#              fire, smoke, person, fire_extinguisher
#   enabled  — можно временно отключить детектор.
# ------------------------------------------------------------------
models:
  fire:
    weights: "models/fire.pt"      # если весов нет — download_models.py подскажет; можно поставить "mock"
    enabled: true
    classes:
      0: fire
      1: smoke
  person:
    weights: "models/yolov8n.pt"   # стандартный COCO-детектор, класс 0 = person
    enabled: true
    classes:
      0: person
  extinguisher:
    weights: "models/ext.pt"       # опционально; если файла нет — проверка огнетушителя = «не настроена»
    enabled: true
    classes:
      0: fire_extinguisher

# ------------------------------------------------------------------
# Параметры детекции и анти-FP фильтра
# ------------------------------------------------------------------
detection:
  conf_threshold: 0.40        # порог уверенности (выше = меньше ложных)
  persistence_frames: 4       # огонь/дым должен держаться >= N кадров подряд
  alert_cooldown_sec: 60      # не слать повторный алерт по зоне чаще, чем раз в N сек
  near_zone_margin: 0.05      # «рядом с зоной» = в пределах этой доли кадра от полигона (для огнетушителя)

# ------------------------------------------------------------------
# Зоны огневых работ. Координаты полигона — НОРМАЛИЗОВАННЫЕ (0..1)
# относительно размера кадра, поэтому не зависят от разрешения камеры.
# Полигон можно нарисовать в UI на странице / (кнопка «Задать зону»).
# ------------------------------------------------------------------
zones:
  - id: "A"
    polygon: [[0.30, 0.25], [0.70, 0.25], [0.70, 0.80], [0.30, 0.80]]

# ------------------------------------------------------------------
# Алерты
# ------------------------------------------------------------------
alerts:
  telegram:
    enabled: true             # реально отправит, только если в .env задан токен и chat_id
  webhook_url: ""             # если задан — дублируем событие POST-запросом (JSON)
