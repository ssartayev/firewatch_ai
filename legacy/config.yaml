# =====================================================================
# FireWatch AI — MVP configuration
# All paths are relative to the firewatch/ folder (the project root).
# Secrets (Telegram token etc.) do NOT live here — see .env / .env.example
# =====================================================================

# Video source:
#   0                      -> laptop webcam (default)
#   "rtsp://user:pass@ip:554/..." -> IP camera
#   "data/demo_fire.mp4"   -> synthetic welding clip (offline demo)
# Override without editing this file: FIREWATCH_VIDEO_SOURCE=... uvicorn ...
video_source: 0

# Target processing FPS (frames are dropped down to this rate).
target_fps: 3

# Loop the video file (handy for demos/pilots). Ignored for RTSP.
loop_video: true

# ------------------------------------------------------------------
# Detector models. For each one:
#   weights  — path to .pt weights, or the special value "mock" (a demo
#              detector with no neural network that emits scripted detections,
#              so zone/rule/alert logic runs before real weights exist).
#   classes  — maps a model class index to a canonical name.
#              Canonical names understood by the rule engine:
#              fire, smoke, person, fire_extinguisher
#   enabled  — temporarily disable a detector.
# ------------------------------------------------------------------
models:
  fire:
    weights: "models/fire.pt"      # missing? run download_models.py, or set "mock"
    enabled: true
    classes:
      0: fire
      1: smoke
  person:
    weights: "models/yolov8n.pt"   # standard COCO detector, class 0 = person
    enabled: true
    classes:
      0: person
  extinguisher:
    weights: "models/ext.pt"       # optional; if absent, the extinguisher check reports "not configured"
    enabled: true
    classes:
      0: fire_extinguisher

# ------------------------------------------------------------------
# Detection parameters and the false-positive filter
# ------------------------------------------------------------------
detection:
  conf_threshold: 0.40        # confidence threshold (higher = fewer false positives)
  persistence_frames: 4       # fire/smoke must persist for >= N consecutive frames
  alert_cooldown_sec: 60      # do not re-alert the same zone more than once every N seconds
  near_zone_margin: 0.05      # "near the zone" = within this fraction of the frame (extinguisher check)

# ------------------------------------------------------------------
# Hot-work zones. Polygon coordinates are NORMALISED (0..1) relative to
# the frame size, so they do not depend on the camera resolution.
# The polygon can be drawn in the UI on / (the "Set zone" button).
# ------------------------------------------------------------------
zones:
  - id: "A"
    polygon: [[0.30, 0.25], [0.70, 0.25], [0.70, 0.80], [0.30, 0.80]]

# ------------------------------------------------------------------
# Alerts
# ------------------------------------------------------------------
alerts:
  telegram:
    enabled: true             # only actually sends if a token and chat_id are set in .env
  webhook_url: ""             # if set, the event is also POSTed as JSON
